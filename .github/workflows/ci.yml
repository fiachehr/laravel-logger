name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        framework: ['12', '13']
        include:
          - framework: '12'
            testbench: '10'
          - framework: '13'
            testbench: '11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer update --with 'laravel/framework:^${{ matrix.framework }}.0' --with 'orchestra/testbench:^${{ matrix.testbench }}.0' --prefer-dist --no-interaction -W
      - run: composer check
      - run: composer audit
