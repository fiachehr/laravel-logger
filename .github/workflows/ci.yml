name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        framework: ['12', '13']
        include:
          - framework: '12'
            testbench: '10'
          - framework: '13'
            testbench: '11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer update --with 'laravel/framework:^${{ matrix.framework }}.0' --with 'orchestra/testbench:^${{ matrix.testbench }}.0' --prefer-dist --no-interaction -W
      - run: composer check
      - run: composer audit
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: node --check resources/assets/explorer-v1.js
      - run: npx playwright install --with-deps chromium
      - run: tools/create-smoke-host.sh "$RUNNER_TEMP/explorer-host"
      - run: LOG_EXPLORER_SMOKE_AUTH=credentials tools/create-smoke-host.sh "$RUNNER_TEMP/credentials-host"
      - name: Browser tests on real Laravel host with cached configuration and routes
        run: |
          php "$RUNNER_TEMP/explorer-host/artisan" log-explorer:serve --port=18765 > "$RUNNER_TEMP/explorer-server.log" 2>&1 &
          server_pid=$!
          php "$RUNNER_TEMP/credentials-host/artisan" log-explorer:serve --port=18767 > "$RUNNER_TEMP/credentials-server.log" 2>&1 &
          credentials_pid=$!
          trap 'kill "$server_pid" "$credentials_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:18765/smoke/login && curl -s -o /dev/null http://127.0.0.1:18767/log-explorer/login; then break; fi
            sleep 1
          done
          npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-results
          path: |
            test-results/
            docs/screenshots/
